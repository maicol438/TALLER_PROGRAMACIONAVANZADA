services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: automoviles
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - .:/app

  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

volumes:
  mongo_data:

